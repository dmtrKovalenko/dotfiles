# Use the native macOS pinentry dialog. The default (curses) pinentry needs a
# working $GPG_TTY and silently fails with "Inappropriate ioctl for device"
# whenever gpg is invoked from a context without a controlling terminal —
# which breaks `yadm encrypt` / `yadm decrypt`.
pinentry-program /opt/homebrew/bin/pinentry-mac

# Cache the passphrase for 1h, 8h max, so re-running `yadm encrypt` after
# editing the manifest does not re-prompt every time.
default-cache-ttl 3600
max-cache-ttl 28800
