onboarding = false
[ui]
agent_panel_sort = "spaces"

status_indicators = "symbols"
[theme]
name = "tokyo-night"
auto_switch = false

[keys]
prefix = "ctrl+space"
help = "prefix+f1"
# Native tab bindings: !/@/# select tabs 1/2/3 locally and remotely.
switch_tab = ["prefix+1..9", "prefix+shift+1", "prefix+shift+2", "prefix+shift+3"]
# Prefix bindings also apply after prefix+w enters workspace navigation.
open_worktree = "prefix+g"
goto = "prefix+/"
# moved off prefix+minus so prefix+- is free for tab 4
split_horizontal = "prefix+shift+v"

# Custom tab bindings: -/= select tabs 4/5 by position.
# Remote custom commands require --remote-keybindings server.

[[keys.command]]
key = "prefix+-"
type = "shell"
command = 't=$("$HOME/.local/bin/herdr" tab list --workspace "${HERDR_ACTIVE_WORKSPACE_ID:-$HERDR_WORKSPACE_ID}" | /usr/bin/jq -r ".result.tabs[3].tab_id // empty"); [ -n "$t" ] && "$HOME/.local/bin/herdr" tab focus "$t"'

[[keys.command]]
key = "prefix+="
type = "shell"
command = 't=$("$HOME/.local/bin/herdr" tab list --workspace "${HERDR_ACTIVE_WORKSPACE_ID:-$HERDR_WORKSPACE_ID}" | /usr/bin/jq -r ".result.tabs[4].tab_id // empty"); [ -n "$t" ] && "$HOME/.local/bin/herdr" tab focus "$t"'

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "nathan-poncet.herdr-fingers.start"
description = "copy with hints"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "workspace-save.save-default"
description = "save default tabs and pane layout for new worktree workspaces"

[[keys.command]]
key = "prefix+alt+w"
type = "plugin_action"
command = "workspace-save.open"
description = "restore saved workspace"

[experimental]
kitty_graphics = true

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[remote]
# Use the existing SSH config, including its auth hooks and control sockets.
manage_ssh_config = false
