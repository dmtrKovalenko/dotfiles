[package]
name = "herdr-fingers"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "tmux-fingers for Herdr: type a short hint to copy, paste or open anything visible in a pane"
license = "MIT"
repository = "https://github.com/nathan-poncet/herdr-fingers"
readme = "README.md"
keywords = ["herdr", "terminal", "tui", "clipboard", "tmux-fingers"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.23"
crossterm = "0.29"
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
thiserror = "2"
toml = "1.1"
unicode-width = "0.2"
libc = "0.2"
url = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
