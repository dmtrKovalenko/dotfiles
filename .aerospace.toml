# AeroSpace config. Docs: https://nikitabobko.github.io/AeroSpace/guide
# Reload after editing: cmd-alt-shift-; then esc   (or: aerospace reload-config)

config-version = 2
persistent-workspaces = ['1', '2', '3']   # always exist, even when empty
start-at-login = true
after-login-command = []
after-startup-command = ['exec-and-forget ~/.config/aerospace/auto-quarter.sh']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Even split by default. Ratio presets are on cmd-alt-shift-r / cmd-alt-shift-e below.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'
accordion-padding = 30

# Keep cursor with focus so trackpad + keys agree.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# ---------------------------------------------------------------------------
# Workspaces
#   1  dev    kitty + browser            (main monitor)
#   2  work   editors, other browsers    (main monitor)
#   3  side   chat + media               (laptop screen when docked)
#   S  scratchpad  stash windows out of the layout, summon them back floating
# When only one display is connected, all live on it.
# ---------------------------------------------------------------------------

[workspace-to-monitor-force-assignment]
# Pinned by monitor name so it doesn't flip if the menu bar moves.
# XDR connected: 1 and 2 on the XDR, 3 (side) on the laptop screen. Undocked: everything on the built-in.
1 = ['XDR', 'main']
2 = ['XDR', 'main']
3 = 'built-in'


[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.dt.Xcode'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'UAD Meter'
run = 'layout floating'

# Apps that must always tile (guards against an accidental float toggle)
[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = 'layout tiling'

# Things that should never be tiled.
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.sindresorhus.Velja'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.installer'
run = 'layout floating'

# Dialogs / sheets / pickers of any app float.
[[on-window-detected]]
if.window-title-regex-substring = '(?i)^(open|save|save as|print|preferences|settings)'
run = 'layout floating'

# ---------------------------------------------------------------------------
# Keys. Modifier is cmd+alt everywhere, so bare alt still types symbols
# and stays free for kitty / nvim.
# ---------------------------------------------------------------------------
[mode.main.binding]

# Focus between windows (kitty <-> browser is cmd-alt-h / cmd-alt-l)
cmd-alt-h = 'focus left'
cmd-alt-j = 'focus down'
cmd-alt-k = 'focus up'
cmd-alt-l = 'focus right'

# Swap the focused window with its neighbour (tree stays the same, windows trade places)
cmd-alt-shift-h = 'swap left'
cmd-alt-shift-j = 'swap down'
cmd-alt-shift-k = 'swap up'
cmd-alt-shift-l = 'swap right'

# Move the focused window through the tree (can enter/leave columns)
cmd-ctrl-alt-h = 'move left'
cmd-ctrl-alt-j = 'move down'
cmd-ctrl-alt-k = 'move up'
cmd-ctrl-alt-l = 'move right'

# Workspaces
cmd-alt-1 = 'workspace 1'
cmd-alt-2 = 'workspace 2'
cmd-alt-3 = 'workspace 3'
# aliases: the other keyboard's top row sends shift+digits (! @ # $ %)
cmd-alt-shift-1 = 'workspace 1'
cmd-alt-shift-2 = 'workspace 2'
cmd-alt-shift-3 = 'workspace 3'
cmd-alt-tab = 'workspace-back-and-forth'
cmd-alt-left = 'workspace --wrap-around prev'
cmd-alt-right = 'workspace --wrap-around next'

# Send focused window to a workspace and follow it
cmd-ctrl-alt-1 = 'move-node-to-workspace --focus-follows-window 1'
cmd-ctrl-alt-2 = 'move-node-to-workspace --focus-follows-window 2'
cmd-ctrl-alt-3 = 'move-node-to-workspace --focus-follows-window 3'
# aliases for the other keyboard's shifted top row
cmd-ctrl-alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
cmd-ctrl-alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
cmd-ctrl-alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'

# Monitors
cmd-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
cmd-alt-shift-left = 'move-node-to-monitor --wrap-around prev'
cmd-alt-shift-right = 'move-node-to-monitor --wrap-around next'

# Sizing
cmd-alt-minus = 'resize smart -60'
cmd-alt-equal = 'resize smart +60'
cmd-alt-0 = 'balance-sizes'                                          # back to even split
cmd-alt-shift-r = 'exec-and-forget ~/.config/aerospace/ratio.py 60'  # focused window -> 60% width
cmd-alt-shift-e = 'exec-and-forget ~/.config/aerospace/ratio.py 70'  # focused window -> 70% width

# Layouts
cmd-alt-f = 'fullscreen'                        # focused window fills the workspace, toggle
cmd-alt-shift-f = 'layout floating tiling'      # toggle float for focused window
cmd-alt-slash = 'layout tiles horizontal vertical'
cmd-alt-a = 'layout accordion tiles'            # toggle: one window at a time (swap with cmd-alt-h/l) <-> side-by-side
cmd-alt-q = 'join-with left'                     # stack focused window under its left neighbour (3rd window -> bottom quarter)
cmd-alt-shift-q = 'join-with right'              # same, but under the right neighbour

# Apps
f8 = 'exec-and-forget open -b net.kovidgoyal.kitty'                      # focus kitty (launch / restore if needed)
cmd-alt-shift-enter = 'exec-and-forget open -na kitty.app'               # new kitty window
f9 = 'exec-and-forget open -b com.brave.Browser'                         # focus Brave (launch / restore if needed)
cmd-alt-shift-b = 'exec-and-forget open -na "Brave Browser.app"'         # new Brave window

# Scratchpad (workspace S) and window switcher
cmd-alt-shift-s = 'exec-and-forget ~/.config/aerospace/scratchpad.sh stash'   # hide focused window in S
cmd-alt-s = 'exec-and-forget ~/.config/aerospace/scratchpad.sh show'          # summon last stashed window (floating) / toggle S
cmd-alt-w = 'exec-and-forget ~/.config/aerospace/window-switcher.sh'          # fuzzy switch to any window (Vicinae dmenu)

# Service mode
cmd-alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']        # reset layout tree
f = ['layout floating tiling', 'mode main']
a = ['layout accordion horizontal vertical', 'mode main']   # accordion (stacked) layout
backspace = ['close-all-windows-but-current', 'mode main']
cmd-alt-shift-h = ['join-with left', 'mode main']
cmd-alt-shift-j = ['join-with down', 'mode main']
cmd-alt-shift-k = ['join-with up', 'mode main']
cmd-alt-shift-l = ['join-with right', 'mode main']
